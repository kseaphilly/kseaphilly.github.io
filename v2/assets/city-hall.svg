<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!--
    Philadelphia City Hall — refined silhouette
    More accurate silhouette with:
      · William Penn wearing broad Quaker hat, long coat, right arm raised
      · Belfry lantern with visible arched openings (negative space)
      · Clock tower with round clock-face cutouts
      · Multi-tiered tower profile (upper shaft, clock, base trumpet)
      · Mansard roofline ridge across the main building
      · Four peaked corner pavilions (including side projections)
      · Main building body with central entrance archway
  -->

  <!-- ═══ WILLIAM PENN STATUE ═══ -->
  <!-- Quaker broad-brimmed hat (scaled down for realism) -->
  <path fill="currentColor" d="
    M191,24
    L209,24
    L210,27
    L190,27 Z
  "/>
  <!-- Hat crown -->
  <path fill="currentColor" d="
    M195,19
    C195,17 197,16 200,16
    C203,16 205,17 205,19
    L205,24
    L195,24 Z
  "/>
  <!-- Head / face -->
  <ellipse cx="200" cy="31" rx="3.5" ry="3.5" fill="currentColor"/>
  <!-- Long coat body (Quaker-style) -->
  <path fill="currentColor" d="
    M193,36
    L207,36
    L212,62
    L188,62 Z
  "/>
  <!-- Right arm (scaled down) -->
  <path fill="currentColor" d="
    M206,42
    L218,42
    L224,46
    L225,49
    L222,50
    L216,47
    L206,46 Z
  "/>
  <!-- Left arm at side holding a scroll (Charter of Pennsylvania) -->
  <path fill="currentColor" d="
    M193,42
    L186,52
    L184,62
    L188,64
    L192,58
    L195,48 Z
  "/>
  <!-- Legs -->
  <rect x="195" y="62" width="4" height="8" fill="currentColor"/>
  <rect x="201" y="62" width="4" height="8" fill="currentColor"/>

  <!-- ═══ STATUE BASE / PLINTH atop belfry ═══ -->
  <path fill="currentColor" d="
    M188,70
    L212,70
    L214,74
    L186,74 Z
  "/>
  <rect x="190" y="74" width="20" height="6" fill="currentColor"/>

  <!-- ═══ BELFRY / LANTERN ═══ -->
  <!-- Dome-capped lantern with four arched openings -->
  <path fill="currentColor" d="
    M178,80
    L222,80
    L222,108
    L178,108 Z
  "/>
  <!-- Arched openings (negative space cut from the lantern) -->
  <path fill="#fff" d="
    M183,90
    C183,86 186,84 189,84
    C192,84 195,86 195,90
    L195,104
    L183,104 Z
  "/>
  <path fill="#fff" d="
    M205,90
    C205,86 208,84 211,84
    C214,84 217,86 217,90
    L217,104
    L205,104 Z
  "/>
  <!-- Cornice below lantern -->
  <path fill="currentColor" d="
    M175,108 L225,108 L222,116 L178,116 Z
  "/>

  <!-- ═══ UPPER TOWER SHAFT (slender rectangular section) ═══ -->
  <rect x="181" y="116" width="38" height="28" fill="currentColor"/>
  <!-- Vertical pilaster lines on the shaft -->
  <rect x="190" y="118" width="1.5" height="24" fill="#fff" opacity="0.30"/>
  <rect x="208" y="118" width="1.5" height="24" fill="#fff" opacity="0.30"/>

  <!-- ═══ CLOCK TOWER LEVEL (wider, with round clock face) ═══ -->
  <!-- Top cornice -->
  <path fill="currentColor" d="
    M168,144 L232,144 L230,150 L170,150 Z
  "/>
  <!-- Clock tower body -->
  <rect x="170" y="150" width="60" height="44" fill="currentColor"/>
  <!-- Round clock face (negative space) -->
  <circle cx="200" cy="172" r="13" fill="#fff" opacity="0.92"/>
  <!-- Clock hands -->
  <rect x="199" y="161" width="2" height="12" fill="currentColor"/>
  <rect x="200" y="171" width="10" height="2" fill="currentColor"/>
  <!-- Clock face inner bezel -->
  <circle cx="200" cy="172" r="13" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <!-- Base cornice of clock tower -->
  <path fill="currentColor" d="
    M166,194 L234,194 L232,200 L168,200 Z
  "/>

  <!-- ═══ TOWER BASE (trumpet-flare down to roofline) ═══ -->
  <path fill="currentColor" d="
    M154,200
    L246,200
    L250,218
    L150,218 Z
  "/>
  <!-- Heavy cornice at roofline -->
  <path fill="currentColor" d="
    M148,218 L252,218 L250,226 L150,226 Z
  "/>

  <!-- ═══ MANSARD ROOF RIDGE ═══ -->
  <!-- Characteristic sloped mansard roofline across the main building -->
  <path fill="currentColor" d="
    M6,226
    L150,226
    L150,240
    L6,240 Z
  "/>
  <path fill="currentColor" d="
    M250,226
    L394,226
    L394,240
    L250,240 Z
  "/>

  <!-- ═══ CORNER PAVILIONS (peaked cupolas projecting above mansard) ═══ -->
  <!-- Left corner pavilion with pyramidal peak -->
  <path fill="currentColor" d="
    M16,208
    L36,196
    L56,208
    L56,228
    L16,228 Z
  "/>
  <!-- Small spire on top -->
  <rect x="35" y="186" width="2" height="12" fill="currentColor"/>
  <circle cx="36" cy="186" r="2" fill="currentColor"/>

  <!-- Right corner pavilion -->
  <path fill="currentColor" d="
    M344,208
    L364,196
    L384,208
    L384,228
    L344,228 Z
  "/>
  <rect x="363" y="186" width="2" height="12" fill="currentColor"/>
  <circle cx="364" cy="186" r="2" fill="currentColor"/>

  <!-- ═══ MAIN BUILDING BODY ═══ -->
  <rect x="6" y="240" width="388" height="50" fill="currentColor"/>

  <!-- Central arched entrance (negative space under tower) -->
  <path fill="#fff" d="
    M186,268
    C186,258 192,252 200,252
    C208,252 214,258 214,268
    L214,290
    L186,290 Z
  " opacity="0.95"/>

  <!-- Subtle column lines on main facade -->
  <rect x="50"  y="246" width="1.5" height="44" fill="#fff" opacity="0.18"/>
  <rect x="100" y="246" width="1.5" height="44" fill="#fff" opacity="0.18"/>
  <rect x="150" y="246" width="1.5" height="44" fill="#fff" opacity="0.18"/>
  <rect x="248" y="246" width="1.5" height="44" fill="#fff" opacity="0.18"/>
  <rect x="298" y="246" width="1.5" height="44" fill="#fff" opacity="0.18"/>
  <rect x="348" y="246" width="1.5" height="44" fill="#fff" opacity="0.18"/>

  <!-- ═══ GROUND / PLAZA ═══ -->
  <rect x="0" y="290" width="400" height="10" fill="currentColor"/>
</svg>
