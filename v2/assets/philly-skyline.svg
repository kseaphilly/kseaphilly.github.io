<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 120">
  <!--
    Philadelphia Skyline — panoramic silhouette for footer
    Left to right: Ben Franklin Bridge → Old City → City Hall → One & Two Liberty Place
                   → Comcast Tower/CTC → 30th St Station area
    Ground level: y=112
  -->

  <!-- ── GROUND LINE ── -->
  <rect x="0" y="112" width="1400" height="8" fill="currentColor"/>

  <!-- ── BEN FRANKLIN BRIDGE (far left) ── -->
  <!-- Left bridge tower -->
  <rect x="18" y="28" width="12" height="84" fill="currentColor"/>
  <!-- Tower top cap -->
  <path fill="currentColor" d="M14,28 L24,14 L34,28 Z"/>
  <!-- Right bridge tower -->
  <rect x="104" y="35" width="12" height="77" fill="currentColor"/>
  <path fill="currentColor" d="M100,35 L110,22 L120,35 Z"/>
  <!-- Main suspension cables (filled triangular approximation) -->
  <path fill="currentColor" d="M22,18 Q65,62 108,28 L114,32 Q66,70 22,26 Z" opacity="0.7"/>
  <!-- Bridge deck / road -->
  <rect x="0" y="74" width="145" height="8" fill="currentColor"/>
  <!-- Bridge approaches from left edge -->
  <path fill="currentColor" d="M0,74 L18,74 L18,82 L0,82 Z"/>
  <!-- Shorter cable hangers -->
  <rect x="38" y="52" width="2" height="22" fill="currentColor" opacity="0.5"/>
  <rect x="56" y="62" width="2" height="12" fill="currentColor" opacity="0.5"/>
  <rect x="74" y="66" width="2" height="8" fill="currentColor" opacity="0.5"/>
  <rect x="90" y="62" width="2" height="12" fill="currentColor" opacity="0.5"/>

  <!-- ── WATERFRONT / OLD CITY area (low-rises) ── -->
  <rect x="148" y="88" width="22" height="24" fill="currentColor"/>
  <rect x="174" y="80" width="18" height="32" fill="currentColor"/>
  <rect x="196" y="84" width="26" height="28" fill="currentColor"/>

  <!-- ── INDEPENDENCE HALL (colonial steeple) ── -->
  <rect x="228" y="78" width="44" height="34" fill="currentColor"/> <!-- main hall -->
  <!-- Clock tower -->
  <rect x="244" y="56" width="12" height="22" fill="currentColor"/>
  <!-- Bell tower -->
  <rect x="246" y="44" width="8" height="12" fill="currentColor"/>
  <!-- Steeple spire -->
  <path fill="currentColor" d="M248,28 L250,44 L252,44 Z"/>
  <rect x="249" y="16" width="2" height="14" fill="currentColor"/>

  <!-- ── TRANSITION MID-RISES ── -->
  <rect x="280" y="70" width="24" height="42" fill="currentColor"/>
  <rect x="308" y="60" width="18" height="52" fill="currentColor"/>
  <rect x="330" y="72" width="22" height="40" fill="currentColor"/>

  <!-- ── CITY HALL (central, iconic tower) ── -->
  <!-- Main building body + corner pavilions -->
  <rect x="358" y="74" width="100" height="38" fill="currentColor"/>
  <!-- Left pavilion peak -->
  <path fill="currentColor" d="M358,64 L380,64 L378,74 L360,74 Z"/>
  <!-- Right pavilion peak -->
  <path fill="currentColor" d="M438,64 L460,64 L458,74 L440,74 Z"/>
  <!-- Tower base -->
  <rect x="390" y="56" width="36" height="18" fill="currentColor"/>
  <!-- Tower clock level -->
  <rect x="396" y="40" width="24" height="16" fill="currentColor"/>
  <!-- Upper tower -->
  <rect x="400" y="24" width="16" height="16" fill="currentColor"/>
  <!-- Belfry -->
  <rect x="403" y="14" width="10" height="10" fill="currentColor"/>
  <!-- William Penn (tiny figure, arm out) -->
  <ellipse cx="408" cy="10" rx="3" ry="3" fill="currentColor"/>
  <path fill="currentColor" d="M406,13 L410,13 L411,18 L405,18 Z"/>
  <path fill="currentColor" d="M409,14 L418,16 L418,18 L409,15 Z"/> <!-- arm -->

  <!-- ── MID-RISES BETWEEN CITY HALL & LIBERTY PLACE ── -->
  <rect x="464" y="62" width="20" height="50" fill="currentColor"/>
  <rect x="488" y="52" width="22" height="60" fill="currentColor"/>
  <rect x="514" y="44" width="18" height="68" fill="currentColor"/>

  <!-- ── ONE LIBERTY PLACE (tallest, distinctive chevron spire) ── -->
  <rect x="538" y="42" width="34" height="70" fill="currentColor"/>
  <!-- Chevron/spire -->
  <path fill="currentColor" d="M538,42 L555,6 L572,42 Z"/>
  <!-- Side spire notches (characteristic stepped top) -->
  <path fill="currentColor" d="M538,42 L543,32 L548,42 Z" opacity="0.5"/>
  <path fill="currentColor" d="M562,42 L567,32 L572,42 Z" opacity="0.5"/>

  <!-- ── TWO LIBERTY PLACE (similar but shorter and slightly thinner) ── -->
  <rect x="578" y="52" width="28" height="60" fill="currentColor"/>
  <!-- Chevron spire (shorter than One Liberty) -->
  <path fill="currentColor" d="M578,52 L592,20 L606,52 Z"/>

  <!-- ── COMCAST CENTER (tall, slightly tapered rectangular glass tower) ── -->
  <rect x="614" y="30" width="32" height="82" fill="currentColor"/>
  <!-- Slight taper at top -->
  <path fill="currentColor" d="M614,30 L616,16 L644,16 L646,30 Z"/>

  <!-- ── COMCAST TECHNOLOGY & INNOVATION CENTER (tallest, rectangular) ── -->
  <rect x="652" y="14" width="30" height="98" fill="currentColor"/>
  <!-- Flat top with slight recess -->
  <rect x="655" y="8" width="24" height="10" fill="currentColor"/>

  <!-- ── OTHER OFFICE TOWERS ── -->
  <rect x="688" y="38" width="24" height="74" fill="currentColor"/>
  <rect x="716" y="46" width="20" height="66" fill="currentColor"/>
  <rect x="740" y="56" width="26" height="56" fill="currentColor"/>
  <rect x="770" y="64" width="18" height="48" fill="currentColor"/>

  <!-- ── SOUTH PHILLY / HOSPITAL BUILDINGS (right side, shorter) ── -->
  <rect x="794" y="72" width="22" height="40" fill="currentColor"/>
  <rect x="820" y="68" width="18" height="44" fill="currentColor"/>
  <rect x="842" y="76" width="24" height="36" fill="currentColor"/>
  <rect x="870" y="80" width="20" height="32" fill="currentColor"/>

  <!-- ── 30TH STREET STATION area (far right, classical structure) ── -->
  <rect x="900" y="74" width="60" height="38" fill="currentColor"/>
  <!-- Colonnade top / cornice -->
  <rect x="896" y="68" width="68" height="10" fill="currentColor"/>
  <!-- Pediment -->
  <path fill="currentColor" d="M896,68 L930,52 L964,68 Z"/>

  <!-- ── FADE-OUT right buildings ── -->
  <rect x="970" y="80" width="30" height="32" fill="currentColor" opacity="0.7"/>
  <rect x="1004" y="84" width="24" height="28" fill="currentColor" opacity="0.5"/>
  <rect x="1032" y="88" width="40" height="24" fill="currentColor" opacity="0.3"/>
  <rect x="1076" y="92" width="324" height="20" fill="currentColor" opacity="0.15"/>
</svg>
